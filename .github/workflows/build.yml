name: Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build with Gradle
        run: gradle build
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: compiled-jar
          path: build/libs/*.jar
